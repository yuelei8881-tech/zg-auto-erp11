<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14213d" />
    <meta name="description" content="Z&G AUTO REPAIR 汽修客户、车辆、工单、库存与财务管理系统" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Z&G AUTO" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/zg-auto-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/zg-auto-icon.svg" />
    <title>Z&G AUTO ERP v0.90.4</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (new URLSearchParams(location.search).has('force-update')) {
        Promise.all([
          'serviceWorker' in navigator
            ? navigator.serviceWorker.getRegistrations().then(items => Promise.all(items.map(item => item.unregister())))
            : Promise.resolve(),
          'caches' in window
            ? caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))))
            : Promise.resolve()
        ]).finally(() => location.replace('/?updated=v0.90.4'));
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
